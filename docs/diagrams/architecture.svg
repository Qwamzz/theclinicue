<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="660" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#202124">Clinicue — Layered System Architecture</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#5f6368">Client–server, four logical layers, single deployable WSGI process</text>

  <!-- ===== Tier 1: Client ===== -->
  <rect x="30" y="70" width="640" height="92" rx="6" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.6"/>
  <text x="44" y="90" font-size="13" font-weight="bold" fill="#1A73E8">1. PRESENTATION TIER — Browser (no build step, no framework)</text>
  <rect x="46" y="100" width="140" height="48" rx="4" fill="#ffffff" stroke="#1A73E8"/>
  <text x="116" y="120" text-anchor="middle" font-size="11" fill="#202124">Patient Portal</text>
  <text x="116" y="136" text-anchor="middle" font-size="9" fill="#5f6368">book / cancel / queue</text>
  <rect x="196" y="100" width="140" height="48" rx="4" fill="#ffffff" stroke="#1A73E8"/>
  <text x="266" y="120" text-anchor="middle" font-size="11" fill="#202124">Staff Console</text>
  <text x="266" y="136" text-anchor="middle" font-size="9" fill="#5f6368">day sheet / queue</text>
  <rect x="346" y="100" width="140" height="48" rx="4" fill="#ffffff" stroke="#1A73E8"/>
  <text x="416" y="120" text-anchor="middle" font-size="11" fill="#202124">Admin Console</text>
  <text x="416" y="136" text-anchor="middle" font-size="9" fill="#5f6368">config / audit / reports</text>
  <rect x="496" y="100" width="158" height="48" rx="4" fill="#ffffff" stroke="#1A73E8"/>
  <text x="575" y="120" text-anchor="middle" font-size="11" fill="#202124">api.js · router.js · ui.js</text>
  <text x="575" y="136" text-anchor="middle" font-size="9" fill="#5f6368">fetch wrapper, hash router</text>

  <!-- arrow 1->2 -->
  <line x1="350" y1="162" x2="350" y2="192" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="360" y="182" font-size="10" fill="#5f6368">HTTPS · JSON · session cookie + X-CSRF-Token</text>

  <!-- ===== Tier 2: API ===== -->
  <rect x="30" y="196" width="640" height="98" rx="6" fill="#E6F4EA" stroke="#137333" stroke-width="1.6"/>
  <text x="44" y="216" font-size="13" font-weight="bold" fill="#137333">2. APPLICATION TIER — Flask blueprints (HTTP concerns only)</text>
  <rect x="46" y="226" width="98" height="26" rx="4" fill="#ffffff" stroke="#137333"/>
  <text x="95" y="243" text-anchor="middle" font-size="10" fill="#202124">auth.py</text>
  <rect x="152" y="226" width="112" height="26" rx="4" fill="#ffffff" stroke="#137333"/>
  <text x="208" y="243" text-anchor="middle" font-size="10" fill="#202124">appointments.py</text>
  <rect x="272" y="226" width="90" height="26" rx="4" fill="#ffffff" stroke="#137333"/>
  <text x="317" y="243" text-anchor="middle" font-size="10" fill="#202124">queue.py</text>
  <rect x="370" y="226" width="90" height="26" rx="4" fill="#ffffff" stroke="#137333"/>
  <text x="415" y="243" text-anchor="middle" font-size="10" fill="#202124">catalog.py</text>
  <rect x="468" y="226" width="90" height="26" rx="4" fill="#ffffff" stroke="#137333"/>
  <text x="513" y="243" text-anchor="middle" font-size="10" fill="#202124">admin.py</text>
  <rect x="566" y="226" width="88" height="26" rx="4" fill="#ffffff" stroke="#137333"/>
  <text x="610" y="243" text-anchor="middle" font-size="10" fill="#202124">health.py</text>
  <rect x="46" y="260" width="608" height="26" rx="4" fill="#ffffff" stroke="#137333" stroke-dasharray="4 2"/>
  <text x="350" y="277" text-anchor="middle" font-size="10" fill="#202124">Request pipeline:  @require_auth  →  @require_role  →  @require_csrf  →  validators.py  →  service call</text>

  <line x1="350" y1="294" x2="350" y2="322" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="360" y="313" font-size="10" fill="#5f6368">plain Python calls — no HTTP objects cross this boundary (NFR-MNT-01)</text>

  <!-- ===== Tier 3: Domain ===== -->
  <rect x="30" y="326" width="640" height="94" rx="6" fill="#FEF7E0" stroke="#B06000" stroke-width="1.6"/>
  <text x="44" y="346" font-size="13" font-weight="bold" fill="#B06000">3. DOMAIN TIER — Service layer (all business rules; framework-independent)</text>
  <rect x="46" y="356" width="192" height="52" rx="4" fill="#ffffff" stroke="#B06000"/>
  <text x="142" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#202124">scheduling.py</text>
  <text x="142" y="389" text-anchor="middle" font-size="9" fill="#5f6368">slot generation, conflict</text>
  <text x="142" y="401" text-anchor="middle" font-size="9" fill="#5f6368">exclusion, booking, cancel</text>
  <rect x="248" y="356" width="192" height="52" rx="4" fill="#ffffff" stroke="#B06000"/>
  <text x="344" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#202124">queue.py</text>
  <text x="344" y="389" text-anchor="middle" font-size="9" fill="#5f6368">check-in, ticketing, call next,</text>
  <text x="344" y="401" text-anchor="middle" font-size="9" fill="#5f6368">complete, no-show, state machine</text>
  <rect x="450" y="356" width="204" height="52" rx="4" fill="#ffffff" stroke="#B06000"/>
  <text x="552" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#202124">reports.py</text>
  <text x="552" y="389" text-anchor="middle" font-size="9" fill="#5f6368">daily summary, utilisation,</text>
  <text x="552" y="401" text-anchor="middle" font-size="9" fill="#5f6368">mean waiting time</text>

  <line x1="350" y1="420" x2="350" y2="448" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="360" y="439" font-size="10" fill="#5f6368">parameterised SQL only (FR-56)</text>

  <!-- ===== Tier 4: DAL ===== -->
  <rect x="30" y="452" width="640" height="70" rx="6" fill="#F3E8FD" stroke="#7B1FA2" stroke-width="1.6"/>
  <text x="44" y="472" font-size="13" font-weight="bold" fill="#7B1FA2">4. DATA ACCESS LAYER — db.py</text>
  <rect x="46" y="482" width="146" height="28" rx="4" fill="#ffffff" stroke="#7B1FA2"/>
  <text x="119" y="500" text-anchor="middle" font-size="10" fill="#202124">connection per request</text>
  <rect x="202" y="482" width="146" height="28" rx="4" fill="#ffffff" stroke="#7B1FA2"/>
  <text x="275" y="500" text-anchor="middle" font-size="10" fill="#202124">transaction / rollback</text>
  <rect x="358" y="482" width="146" height="28" rx="4" fill="#ffffff" stroke="#7B1FA2"/>
  <text x="431" y="500" text-anchor="middle" font-size="10" fill="#202124">query / execute helpers</text>
  <rect x="514" y="482" width="140" height="28" rx="4" fill="#ffffff" stroke="#7B1FA2"/>
  <text x="584" y="500" text-anchor="middle" font-size="10" fill="#202124">write_audit()</text>

  <line x1="350" y1="522" x2="350" y2="550" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== Tier 5: DB ===== -->
  <rect x="30" y="554" width="640" height="78" rx="6" fill="#FCE8E6" stroke="#C5221F" stroke-width="1.6"/>
  <text x="44" y="574" font-size="13" font-weight="bold" fill="#C5221F">5. PERSISTENCE — SQLite 3 (WAL, foreign keys ON)</text>
  <text x="44" y="594" font-size="10" fill="#202124">users · services · practitioners · availability_rules · appointments · queue_entries · audit_log</text>
  <text x="44" y="612" font-size="9.5" fill="#C5221F" font-style="italic">TD-01: single-file SQLite on an ephemeral container filesystem. Abstracted behind db.py so migration to PostgreSQL is bounded.</text>

  <!-- ===== Cross-cutting sidebar ===== -->
  <rect x="690" y="70" width="180" height="562" rx="6" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.6"/>
  <text x="780" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#3C4043">CROSS-CUTTING</text>
  <line x1="704" y1="100" x2="856" y2="100" stroke="#9AA0A6"/>

  <rect x="704" y="112" width="152" height="62" rx="4" fill="#ffffff" stroke="#5F6368"/>
  <text x="780" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#202124">security.py</text>
  <text x="712" y="146" font-size="9" fill="#5f6368">PBKDF2 hashing · JWT issue</text>
  <text x="712" y="158" font-size="9" fill="#5f6368">/verify · CSRF double-submit</text>
  <text x="712" y="170" font-size="9" fill="#5f6368">RBAC · login rate limiting</text>

  <rect x="704" y="184" width="152" height="52" rx="4" fill="#ffffff" stroke="#5F6368"/>
  <text x="780" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#202124">validators.py</text>
  <text x="712" y="218" font-size="9" fill="#5f6368">presence · type · length</text>
  <text x="712" y="230" font-size="9" fill="#5f6368">format · range (FR-53)</text>

  <rect x="704" y="246" width="152" height="52" rx="4" fill="#ffffff" stroke="#5F6368"/>
  <text x="780" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#202124">errors.py</text>
  <text x="712" y="280" font-size="9" fill="#5f6368">single JSON envelope</text>
  <text x="712" y="292" font-size="9" fill="#5f6368">no stack traces (FR-55)</text>

  <rect x="704" y="308" width="152" height="52" rx="4" fill="#ffffff" stroke="#5F6368"/>
  <text x="780" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#202124">audit log</text>
  <text x="712" y="342" font-size="9" fill="#5f6368">actor · action · entity</text>
  <text x="712" y="354" font-size="9" fill="#5f6368">timestamp · IP (FR-48)</text>

  <rect x="704" y="370" width="152" height="52" rx="4" fill="#ffffff" stroke="#5F6368"/>
  <text x="780" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="#202124">config.py</text>
  <text x="712" y="404" font-size="9" fill="#5f6368">env vars only, safe dev</text>
  <text x="712" y="416" font-size="9" fill="#5f6368">defaults (NFR-MNT-04)</text>

  <rect x="704" y="432" width="152" height="64" rx="4" fill="#ffffff" stroke="#5F6368"/>
  <text x="780" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#202124">security headers</text>
  <text x="712" y="466" font-size="9" fill="#5f6368">CSP · X-Frame-Options</text>
  <text x="712" y="478" font-size="9" fill="#5f6368">X-Content-Type-Options</text>
  <text x="712" y="490" font-size="9" fill="#5f6368">Referrer-Policy</text>

  <rect x="704" y="506" width="152" height="112" rx="4" fill="#ffffff" stroke="#5F6368"/>
  <text x="780" y="524" text-anchor="middle" font-size="11" font-weight="bold" fill="#202124">Deployment</text>
  <text x="712" y="542" font-size="9" fill="#5f6368">Gunicorn (2 workers)</text>
  <text x="712" y="556" font-size="9" fill="#5f6368">Docker container</text>
  <text x="712" y="570" font-size="9" fill="#5f6368">TLS at platform edge</text>
  <text x="712" y="584" font-size="9" fill="#5f6368">/api/health probe</text>
  <text x="712" y="598" font-size="9" fill="#5f6368">env-injected secrets</text>
  <text x="712" y="612" font-size="9" fill="#5f6368">stdout structured logs</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5f6368"/>
    </marker>
  </defs>
</svg>
